<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>وینو — یکی پاش رفت رو سیم!</title>
<style>
  /* صفحه‌ی استاتیک خطای ۵۰۲/۵۰۴ — وقتی خود سرورِ سایت پایین است nginx این را
     مستقیم سرو می‌کند؛ پس باید کاملاً خودکفا باشد (بدون فونت/asset خارجی) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: IRANYekanXFaNum, Vazirmatn, Tahoma, system-ui, sans-serif;
    background: #F4F7FA; color: #17212B; line-height: 1.9;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .card { max-width: 520px; }
  svg { width: min(340px, 78vw); height: auto; margin-bottom: 6px; }
  .code {
    display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: 2px;
    color: #2563EB; background: #E8EFFE; border-radius: 999px; padding: 4px 16px;
  }
  h1 { font-weight: 800; font-size: clamp(22px, 4vw, 32px); margin-top: 14px; line-height: 1.6; }
  p { color: #5A6B7A; font-size: 15.5px; margin-top: 10px; }
  a.btn {
    display: inline-block; margin-top: 26px; font-weight: 700; font-size: 15px; color: #fff;
    background: linear-gradient(180deg, #3B82F6, #2563EB); text-decoration: none;
    padding: 11px 26px; border-radius: 999px;
    box-shadow: 0 6px 18px -8px rgba(37,99,235,.55);
  }
  .float { animation: f 3.2s ease-in-out infinite; }
  .float-late { animation: f 3.2s ease-in-out 1.1s infinite; }
  .spark { animation: s 1.4s ease-in-out infinite; transform-origin: center; }
  @keyframes f { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes s { 0%,100% { opacity:.25; transform: scale(.8);} 50% { opacity:1; transform: scale(1.15);} }
  @media (prefers-reduced-motion: reduce) { .float,.float-late,.spark { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 360 240" fill="none" aria-hidden="true">
    <ellipse cx="180" cy="212" rx="130" ry="12" fill="#E8EFFE"/>
    <rect x="296" y="128" width="34" height="44" rx="8" fill="#DBE7FD"/>
    <rect x="304" y="140" width="5" height="12" rx="2.5" fill="#5A6B7A"/>
    <rect x="317" y="140" width="5" height="12" rx="2.5" fill="#5A6B7A"/>
    <path d="M296 166 C 260 186, 238 196, 214 196" stroke="#17212B" stroke-width="5" stroke-linecap="round"/>
    <g transform="rotate(-18 150 196)">
      <rect x="138" y="189" width="26" height="14" rx="6" fill="#17212B"/>
      <rect x="164" y="191.5" width="8" height="3.5" rx="1.75" fill="#5A6B7A"/>
      <rect x="164" y="197" width="8" height="3.5" rx="1.75" fill="#5A6B7A"/>
    </g>
    <path d="M60 206 C 92 206, 112 202, 136 198" stroke="#17212B" stroke-width="5" stroke-linecap="round"/>
    <g class="spark"><path d="M186 176 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#F59E0B"/></g>
    <path class="spark" d="M204 164 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2 Z" fill="#7C5CFF" opacity=".8"/>
    <g class="float">
      <circle cx="120" cy="142" r="36" fill="#2563EB"/>
      <ellipse cx="126" cy="154" rx="18" ry="14" fill="#DBE7FD"/>
      <circle cx="112" cy="132" r="7" fill="#fff"/><circle cx="114" cy="134" r="3.2" fill="#17212B"/>
      <circle cx="134" cy="132" r="7" fill="#fff"/><circle cx="136" cy="134" r="3.2" fill="#17212B"/>
      <path d="M105 122 q6 -5 13 -2" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M128 120 q7 -3 13 2" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M148 143 L158 147 L148 152 Z" fill="#F59E0B"/>
      <circle cx="103" cy="146" r="5" fill="#FCA5A5" opacity=".7"/>
      <path d="M110 176 L108 196" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <path d="M132 176 L138 193" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <path d="M104 197 L114 197" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <path d="M134 194 L144 194" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path class="float-late" d="M158 116 q4 6 0 10 q-4 -4 0 -10 Z" fill="#60A5FA"/>
  </svg>
  <div><span class="code">۵۰۲ / ۵۰۴</span></div>
  <h1>اوه اوه… یکی پاش رفت رو سیم!</h1>
  <p>سرور چند لحظه‌ای در دسترس نیست — تیم فنی داره دوشاخه رو می‌زنه سر جاش. یک دقیقه‌ی دیگه دوباره سر بزن.</p>
  <a class="btn" href="/">تلاش دوباره</a>
</div>
</body>
</html>
